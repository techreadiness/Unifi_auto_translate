name: Unifi-Japan-Translate

on:
  push:
    paths:
      - "en/**/*.md"  # 영어 원문 폴더 감지
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Unifi Translation (EN to JA)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          set -e
          
          # 1. 대상 파일 찾기 (en 폴더 내 모든 마크다운)
          FILES=$(find en -name "*.md")

          for file in $FILES; do
            REL_PATH=${file#en/}
            TARGET_FILE="ja/$REL_PATH"  # 일본어 결과물 저장 경로
            mkdir -p "$(dirname "$TARGET_FILE")"

            # 2. Front Matter (YAML 헤더)와 본문 분리
            # --- 사이의 설정값은 번역 제외
            FRONT_MATTER=$(awk 'BEGIN{flag=0} /^---$/{if(flag==0){flag=1; next} else{exit}} flag==1{print}' "$file")
            BODY=$(awk 'BEGIN{flag=0} /^---$/{if(flag==0){flag=1; next} else{flag=2; next}} flag==2{print}' "$file")

            if [ -z "$FRONT_MATTER" ]; then BODY=$(cat "$file"); fi

            # 3. 본문 내 링크 및 고유명사 보호 (중요!)
            # 하이퍼링크 [text](url) 전체를 span으로 감싸서 DeepL이 수정 못하게 함
            PROTECTED_BODY=$(echo "$BODY" | sed 's/Unifi/<span translate="no">Unifi<\/span>/g')
            PROTECTED_BODY=$(echo "$PROTECTED_BODY" | sed -E 's/(!?\[[^]]*\]\([^)]*\))/<span translate="no">\1<\/span>/g')

            # 4. DeepL API 호출 (일본어 JA 설정)
            RESPONSE=$(curl -s -X POST "https://api-free.deepl.com/v2/translate" \
              -H "Authorization: DeepL-Auth-Key $DEEPL_API_KEY" \
              --data-urlencode "text=$PROTECTED_BODY" \
              -d "source_lang=EN" \
              -d "target_lang=JA" \
              -d "tag_handling=html")

            TRANSLATED_BODY=$(echo "$RESPONSE" | jq -r '.translations[0].text // empty')

            # 5. 후처리: 보호 태그 제거 및 일본어 전각 기호 교정
            # 일본어는 ( ) 가 （ ） 로 바뀌는 경우가 많아 강제로 반각 복구
            FINAL_BODY=$(echo "$TRANSLATED_BODY" | sed -E 's/<\/?span[^>]*>//g')
            FINAL_BODY=$(echo "$FINAL_BODY" | sed -E 's/（/(/g' | sed -E 's/）/)/g')
            # ] (url) 처럼 공백 생기는 현상 방지
            FINAL_BODY=$(echo "$FINAL_BODY" | sed -E 's/(!?\[[^]]*\]) *\(([^)]*)\)/\1(\2)/g')

            # 6. 원본 Front Matter 합쳐서 저장
            if [ -n "$FRONT_MATTER" ]; then
              echo -e "---\n$FRONT_MATTER\n---\n\n$FINAL_BODY" > "$TARGET_FILE"
            else
              echo "$FINAL_BODY" > "$TARGET_FILE"
            fi
          done

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ja/
          git commit -m "docs: Auto-translate Unifi EN to JA" || echo "No changes"
          git push origin main
